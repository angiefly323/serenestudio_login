<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶專區登入</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f7f9fc; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 32px 24px; }
        
        .header { text-align: center; margin-bottom: 24px; }
        .header img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; background: #eee; margin-bottom: 16px; }
        .header h1 { font-size: 20px; color: #111; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #666; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        
        .phone-input { display: flex; align-items: center; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .prefix { background: #f0f0f0; padding: 12px 14px; font-size: 14px; color: #555; border-right: 1px solid #ddd; }
        .phone-input input { border: none; padding: 12px; width: 100%; font-size: 14px; outline: none; }
        
        .input-field { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .input-field:focus, .phone-input:focus-within { border-color: #000; }

        .forgot-pw { text-align: right; margin-bottom: 20px; }
        .forgot-pw a { color: #666; font-size: 12px; text-decoration: none; }

        .btn-login { width: 100%; background: #000; color: #fff; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background: #333; }

        .new-user-box { margin-top: 32px; background: #f9faec; border: 1px solid #e5e9b4; border-radius: 8px; padding: 20px; text-align: center; }
        .new-user-box h2 { font-size: 15px; color: #3f4513; margin-bottom: 10px; }
        .new-user-box p { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 16px; text-align: left; }
        
        .btn-whatsapp { display: inline-flex; justify-content: center; align-items: center; width: 100%; background: #25D366; color: #fff; text-decoration: none; padding: 12px; font-size: 14px; font-weight: 600; border-radius: 8px; transition: 0.2s; }
        .btn-whatsapp:hover { background: #1ebe56; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 頂部標題區 -->
        <div class="header">
            <!-- 稍後可以將 logo.png 替換成你的真實 Logo -->
            <img src="https://via.placeholder.com/80?text=Logo" alt="網店 Logo">
            <h1>歡迎登入客戶專區</h1>
            <p>隨時追蹤你的韓國代購訂單與物流狀態</p>
        </div>

        <!-- 登入表單區 -->
        <form onsubmit="event.preventDefault(); alert('這是初稿版面，尚未連結後台資料庫！');">
            <div class="form-group">
                <label>登入電話號碼</label>
                <div class="phone-input">
                    <span class="prefix">+852</span>
                    <input type="tel" placeholder="請輸入 8 位數字號碼" required>
                </div>
            </div>

            <div class="form-group">
                <label>密碼</label>
                <input type="password" class="input-field" placeholder="請輸入系統預設或專屬密碼" required>
            </div>

            <div class="forgot-pw">
                <a href="#">忘記密碼？</a>
            </div>

            <button type="submit" class="btn-login">登入</button>
        </form>

        <!-- 新手引導提示區 -->
        <div class="new-user-box">
            <h2>首次使用代購服務？</h2>
            <p>為確保代購報價準確，首次落單請直接 WhatsApp 聯絡我們。提供商品連結後，我們會為你計算專屬報價（劃一 5,000 KRW 手續費）。<br><br>確認 FPS / PayMe 付款後，客服會即時發送你的專屬<strong>登入電話號碼</strong>及<strong>系統預設密碼</strong>！</p>
            <!-- 替換以下 href 內為你的 WhatsApp 連結，例如 https://wa.me/85212345678 -->
            <a href="https://wa.me/85200000000" class="btn-whatsapp" target="_blank">馬上 WhatsApp 客服落單</a>
        </div>
    </div>

</body>
</html>
