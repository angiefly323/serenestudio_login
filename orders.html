<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 代購訂單紀錄 / Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #faf7f7; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* =========================================
           電腦版側邊欄 (Desktop Sidebar)
        ========================================= */
        .sidebar { width: 250px; background-color: #ffffff; border-right: 1px solid rgba(0,0,0,0.05); position: fixed; height: 100%; z-index: 1000; transition: 0.3s ease; display: flex; flex-direction: column; }
        .logo-area { background: linear-gradient(135deg, #743133 0%, #522223 100%); padding: 24px; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100px; }
        .logo-area img { width: 85%; max-width: 160px; height: auto; filter: brightness(0) invert(1); }

        .menu-wrapper { flex: 1; overflow-y: auto; padding: 16px 10px; }
        .menu-section-title { font-size: 11px; font-weight: 700; color: #a0a0a0; text-transform: uppercase; letter-spacing: 0.8px; padding: 14px 16px 6px 16px; }

        .menu-list { list-style: none; margin-bottom: 8px; }
        .menu-list li { margin-bottom: 2px; }
        .menu-list li a { display: flex; align-items: center; padding: 11px 16px; color: #444; text-decoration: none; font-size: 14px; border-radius: 10px; font-weight: 500; transition: all 0.2s ease; }
        .menu-list li a i { width: 22px; font-size: 16px; margin-right: 10px; color: #a0a0a0; }
        .menu-list li a:hover { background-color: #f8f3f3; color: #743133; }
        .menu-list li a:hover i { color: #743133; }
        .menu-list li.active a { background-color: #fdf2f2; color: #743133; font-weight: 700; }
        .menu-list li.active a i { color: #743133; }

        .sidebar-footer { padding: 16px; border-top: 1px solid rgba(0,0,0,0.05); background: #fff; }
        .lang-switch-desktop { display: flex; background: #faf7f7; padding: 3px; border-radius: 10px; border: 1px solid rgba(116,49,51,0.1); margin-bottom: 10px; }
        .lang-btn-dt { flex: 1; border: none; background: none; padding: 6px; font-size: 12px; font-weight: 600; color: #777; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .lang-btn-dt.active { background: #ffffff; color: #743133; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        /* 主內容區 */
        .main-content { flex: 1; margin-left: 250px; transition: 0.3s; width: calc(100% - 250px); padding-bottom: 60px; }
        
        /* 🍷 TOPBAR */
        .topbar { 
            background: linear-gradient(135deg, #743133 0%, #522223 100%); 
            padding: 16px 24px; 
            display: flex; align-items: center; justify-content: center; 
            position: sticky; top: 0; z-index: 99; 
            box-shadow: 0 4px 15px rgba(116, 49, 51, 0.15);
        }
        .topbar-logo { height: 38px; width: auto; filter: brightness(0) invert(1); }

        .mobile-lang-tag {
            position: absolute; right: 16px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.25); color: #fff;
            font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
            cursor: pointer; display: none;
        }

        .content-area { padding: 32px; max-width: 950px; margin: 0 auto; }

        .page-header-title {
            font-size: 20px; font-weight: 700; color: #111; margin-bottom: 24px;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* 📦 代購訂單卡片列表 */
        .orders-container { display: flex; flex-direction: column; gap: 16px; }

        .order-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(116, 49, 51, 0.06);
            border-color: rgba(116, 49, 51, 0.15);
        }

        .order-card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 14px; margin-bottom: 14px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
        }

        .order-id { font-size: 15px; font-weight: 800; color: #743133; letter-spacing: -0.01em; }
        .order-date { font-size: 12.5px; color: #888; font-weight: 500; }

        .order-card-body {
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; align-items: center;
        }

        .item-title { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 6px; line-height: 1.4; }
        .item-link { font-size: 12.5px; color: #743133; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .item-link:hover { text-decoration: underline; }

        .price-details { text-align: right; }
        .price-krw { font-size: 12px; color: #888; }
        .price-hkd { font-size: 18px; font-weight: 800; color: #111; margin-top: 2px; }

        .status-badge-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        
        .badge {
            display: inline-block; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; text-align: center;
        }
        
        /* 狀態標籤顏色 */
        .badge-paid { background: #dcfce7; color: #15803d; }
        .badge-unpaid { background: #fee2e2; color: #b91c1c; }
        .badge-process { background: #fef3c7; color: #b45309; }

        .empty-box {
            text-align: center; padding: 60px 20px; background: #fff; border-radius: 20px;
            border: 1px dashed #ddd; color: #888;
        }
        .empty-box i { font-size: 48px; color: #ccc; margin-bottom: 12px; }

        /* 📱 手機版 Bottom Navigation Bar */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            height: 65px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.08); z-index: 1000;
            justify-content: space-around; align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #888; text-decoration: none; font-size: 11px; font-weight: 600; gap: 4px;
            width: 20%; background: none; border: none; cursor: pointer; transition: 0.2s;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active, .nav-item:hover { color: #743133; }

        /* Pop-up List 選單 */
        .popup-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1001; opacity: 0; transition: opacity 0.25s ease;
        }
        .popup-overlay.show { display: block; opacity: 1; }
        .popup-menu {
            position: fixed; bottom: -250px; left: 16px; right: 16px;
            background: #ffffff; border-radius: 20px; padding: 20px 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1002; transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .popup-overlay.show .popup-menu { bottom: 80px; }
        .popup-header { font-size: 14px; font-weight: 700; color: #743133; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        .popup-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .popup-list a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #faf7f7; border-radius: 12px; color: #333; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .popup-list a i { color: #743133; font-size: 16px; width: 20px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; width: 100%; padding-bottom: 80px; }
            .topbar { padding: 14px 20px; }
            .topbar-logo { height: 32px; }
            .mobile-lang-tag { display: block; }
            .content-area { padding: 20px; }
            .order-card-body { grid-template-columns: 1fr; gap: 12px; }
            .price-details { text-align: left; }
            .status-badge-group { align-items: flex-start; flex-direction: row; }
            .mobile-bottom-nav { display: flex; }
        }
    </style>
</head>
<body>

    <!-- 電腦版側邊選單 -->
    <nav class="sidebar">
        <div class="logo-area">
            <img src="Serenestudio.png" alt="Serene Studio Logo">
        </div>

        <div class="menu-wrapper">
            <div class="menu-section-title" data-zh="帳戶總覽" data-en="Overview">帳戶總覽</div>
            <ul class="menu-list">
                <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> <span data-zh="我的帳戶首頁" data-en="Home Dashboard">我的帳戶首頁</span></a></li>
                <li><a href="profile.html"><i class="fa-solid fa-id-card"></i> <span data-zh="會員帳戶資料" data-en="Profile Settings">會員帳戶資料</span></a></li>
            </ul>

            <div class="menu-section-title" data-zh="訂單及物流" data-en="Orders & Shipping">訂單及物流</div>
            <ul class="menu-list">
                <li class="active"><a href="orders.html"><i class="fa-solid fa-file-invoice-dollar"></i> <span data-zh="代購訂單紀錄" data-en="Proxy Orders">代購訂單紀錄</span></a></li>
                <li><a href="tracking.html"><i class="fa-solid fa-box-open"></i> <span data-zh="韓國倉及物流追蹤" data-en="Warehouse Tracking">韓國倉及物流追蹤</span></a></li>
                <li><a href="consolidation.html"><i class="fa-solid fa-plane-departure"></i> <span data-zh="集運單及國際運費" data-en="Consolidations">集運單及國際運費</span></a></li>
            </ul>

            <div class="menu-section-title" data-zh="服務與情報" data-en="Services & Info">服務與情報</div>
            <ul class="menu-list">
                <li><a href="calculator.html"><i class="fa-solid fa-calculator"></i> <span data-zh="運費計算機" data-en="Shipping Calculator">運費計算機</span></a></li>
                <li><a href="intel.html"><i class="fa-solid fa-fire"></i> <span data-zh="韓國網購情報" data-en="Korea Shopping Intel">韓國網購情報</span></a></li>
                <li><a href="guidelines.html"><i class="fa-solid fa-book-open"></i> <span data-zh="購物流程及須知" data-en="Guidelines">購物流程及須知</span></a></li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <div class="lang-switch-desktop">
                <button onclick="switchLanguage('zh')" id="btnZhDt" class="lang-btn-dt active">繁體中文</button>
                <button onclick="switchLanguage('en')" id="btnEnDt" class="lang-btn-dt">English</button>
            </div>
            <a href="index.html" onclick="logout()" style="display:flex; align-items:center; gap:8px; color:#e11d48; text-decoration:none; font-size:13px; font-weight:600; padding:6px 8px;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span data-zh="登出帳戶" data-en="Logout">登出帳戶</span>
            </a>
        </div>
    </nav>

    <!-- 主內容區 -->
    <main class="main-content">
        <header class="topbar">
            <img src="Serenestudio.png" alt="Serene Studio Logo" class="topbar-logo">
            <div class="mobile-lang-tag" onclick="toggleMobileLang()" id="mobileLangBtn">EN</div>
        </header>

        <div class="content-area">
            
            <div class="page-header-title">
                <div>
                    <i class="fa-solid fa-file-invoice-dollar" style="color:#743133; margin-right:8px;"></i>
                    <span data-zh="代購訂單紀錄" data-en="Proxy Order History">代購訂單紀錄</span>
                </div>
            </div>

            <!-- 訂單卡片列表容器 -->
            <div class="orders-container" id="ordersContainer">
                <div class="empty-box">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p data-zh="正在載入您的代購訂單..." data-en="Loading your proxy orders...">正在載入您的代購訂單...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- 📱 手機專屬 Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span data-zh="首頁" data-en="Home">首頁</span>
        </a>

        <button type="button" class="nav-item active" onclick="toggleOrderPopup()">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span data-zh="管理訂單" data-en="Orders">管理訂單</span>
        </button>

        <a href="calculator.html" class="nav-item">
            <i class="fa-solid fa-calculator"></i>
            <span data-zh="運費試算" data-en="Calc">運費試算</span>
        </a>

        <a href="intel.html" class="nav-item">
            <i class="fa-solid fa-fire"></i>
            <span data-zh="網購情報" data-en="Intel">網購情報</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span data-zh="我的帳戶" data-en="Account">我的帳戶</span>
        </a>
    </nav>

    <!-- 💬 Pop-up List -->
    <div class="popup-overlay" id="popupOverlay" onclick="closeOrderPopup()">
        <div class="popup-menu" onclick="event.stopPropagation();">
            <div class="popup-header" data-zh="請選擇訂單管理項目" data-en="Select Order Category">請選擇訂單管理項目</div>
            <ul class="popup-list">
                <li>
                    <a href="orders.html">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <span data-zh="代購訂單紀錄" data-en="Proxy Orders History">代購訂單紀錄</span>
                    </a>
                </li>
                <li>
                    <a href="tracking.html">
                        <i class="fa-solid fa-box-open"></i>
                        <span data-zh="韓國物流追蹤" data-en="KR Warehouse Inventory">韓國物流追蹤</span>
                    </a>
                </li>
                <li>
                    <a href="consolidation.html">
                        <i class="fa-solid fa-plane-departure"></i>
                        <span data-zh="集運訂單" data-en="Consolidation Requests">集運訂單</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyTpnxEfQ9B2ysDjq-H7C1N_1BqRcEZVL0nPBInlHoYKOFQVTP-QM13pLEq3d3opbdm/exec";

        window.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('serene_user'));

            if (!userData || !userData.phone) {
                alert("您尚未登入，請先登入帳戶！");
                window.location.href = "index.html";
                return;
            }

            // 初始化語言設定
            const savedLang = localStorage.getItem('serene_lang') || 'zh';
            switchLanguage(savedLang);

            // 讀取真實訂單紀錄
            fetchOrders(userData.phone);
        });

        async function fetchOrders(phone) {
            const container = document.getElementById('ordersContainer');
            const currentLang = localStorage.getItem('serene_lang') || 'zh';

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "getOrders",
                        phone: phone
                    })
                });

                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    container.innerHTML = ""; // 清空 Loading

                    result.data.forEach(order => {
                        const isPaid = order.paymentStatus === "已付款";
                        const payBadgeClass = isPaid ? "badge-paid" : "badge-unpaid";
                        
                        const itemLinkHtml = order.itemUrl ? 
                            `<a href="${order.itemUrl}" target="_blank" class="item-link"><i class="fa-solid fa-link"></i> ${currentLang === 'en' ? 'View Item Link' : '查看商品原連結'}</a>` : '';

                        const card = `
                            <div class="order-card">
                                <div class="order-card-header">
                                    <div class="order-id"># ${order.orderID}</div>
                                    <div class="order-date"><i class="fa-regular fa-calendar"></i> ${order.orderDate}</div>
                                </div>
                                <div class="order-card-body">
                                    <div>
                                        <div class="item-title">${order.itemName} (x${order.quantity})</div>
                                        ${itemLinkHtml}
                                    </div>
                                    <div class="price-details">
                                        <div class="price-krw">₩ ${Number(order.krwPrice).toLocaleString()} KRW</div>
                                        <div class="price-hkd">HK$ ${order.totalHKD}</div>
                                    </div>
                                    <div class="status-badge-group">
                                        <span class="badge ${payBadgeClass}">${order.paymentStatus}</span>
                                        <span class="badge badge-process">${order.processStatus}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-box">
                            <i class="fa-solid fa-box-open"></i>
                            <p data-zh="尚無代購訂單紀錄" data-en="No proxy orders found">${currentLang === 'en' ? 'No proxy orders found' : '尚無代購訂單紀錄'}</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fa-solid fa-triangle-exclamation" style="color:#e11d48;"></i>
                        <p>${currentLang === 'en' ? 'Failed to load order data' : '無法讀取訂單資料，請稍後再試'}</p>
                    </div>
                `;
            }
        }

        /* 雙語切換邏輯 */
        function switchLanguage(lang) {
            localStorage.setItem('serene_lang', lang);
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-HK';

            document.getElementById('btnZhDt').classList.toggle('active', lang === 'zh');
            document.getElementById('btnEnDt').classList.toggle('active', lang === 'en');
            document.getElementById('mobileLangBtn').innerText = lang === 'en' ? '繁中' : 'EN';

            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-zh');
            });
        }

        function toggleMobileLang() {
            const currentLang = localStorage.getItem('serene_lang') || 'zh';
            switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
        }

        function toggleOrderPopup() { document.getElementById('popupOverlay').classList.toggle('show'); }
        function closeOrderPopup() { document.getElementById('popupOverlay').classList.remove('show'); }

        function logout() {
            localStorage.removeItem('serene_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
