<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 代購訂單紀錄 / Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #faf7f7; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* =========================================
           電腦版側邊欄 (Desktop Sidebar)
        ========================================= */
        .sidebar { width: 250px; background-color: #ffffff; border-right: 1px solid rgba(0,0,0,0.05); position: fixed; height: 100%; z-index: 1000; transition: 0.3s ease; display: flex; flex-direction: column; }
        .logo-area { background: linear-gradient(135deg, #743133 0%, #522223 100%); padding: 24px; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100px; }
        .logo-area img { width: 85%; max-width: 160px; height: auto; filter: brightness(0) invert(1); }

        .menu-wrapper { flex: 1; overflow-y: auto; padding: 16px 10px; }
        .menu-section-title { font-size: 11px; font-weight: 700; color: #a0a0a0; text-transform: uppercase; letter-spacing: 0.8px; padding: 14px 16px 6px 16px; }

        .menu-list { list-style: none; margin-bottom: 8px; }
        .menu-list li { margin-bottom: 2px; }
        .menu-list li a { display: flex; align-items: center; padding: 11px 16px; color: #444; text-decoration: none; font-size: 14px; border-radius: 10px; font-weight: 500; transition: all 0.2s ease; }
        .menu-list li a i { width: 22px; font-size: 16px; margin-right: 10px; color: #a0a0a0; }
        .menu-list li a:hover { background-color: #f8f3f3; color: #743133; }
        .menu-list li a:hover i { color: #743133; }
        .menu-list li.active a { background-color: #fdf2f2; color: #743133; font-weight: 700; }
        .menu-list li.active a i { color: #743133; }

        .sidebar-footer { padding: 16px; border-top: 1px solid rgba(0,0,0,0.05); background: #fff; }
        .lang-switch-desktop { display: flex; background: #faf7f7; padding: 3px; border-radius: 10px; border: 1px solid rgba(116,49,51,0.1); margin-bottom: 10px; }
        .lang-btn-dt { flex: 1; border: none; background: none; padding: 6px; font-size: 12px; font-weight: 600; color: #777; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .lang-btn-dt.active { background: #ffffff; color: #743133; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        /* 主內容區 */
        .main-content { flex: 1; margin-left: 250px; transition: 0.3s; width: calc(100% - 250px); padding-bottom: 60px; }
        
        /* 🍷 TOPBAR */
        .topbar { 
            background: linear-gradient(135deg, #743133 0%, #522223 100%); 
            padding: 16px 24px; 
            display: flex; align-items: center; justify-content: center; 
            position: sticky; top: 0; z-index: 99; 
            box-shadow: 0 4px 15px rgba(116, 49, 51, 0.15);
        }
        .topbar-logo { height: 38px; width: auto; filter: brightness(0) invert(1); }

        .mobile-lang-tag {
            position: absolute; right: 16px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.25); color: #fff;
            font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
            cursor: pointer; display: none;
        }

        .content-area { padding: 32px; max-width: 980px; margin: 0 auto; }

        .page-header-title {
            font-size: 20px; font-weight: 700; color: #111; margin-bottom: 24px;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* 📦 摺疊面板 Accordion 卡片設計 */
        .orders-container { display: flex; flex-direction: column; gap: 16px; }

        .accordion-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .accordion-card:hover {
            box-shadow: 0 8px 24px rgba(116, 49, 51, 0.06);
            border-color: rgba(116, 49, 51, 0.15);
        }

        /* 摺疊面板標頭 (未展開時顯示) */
        .accordion-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            background: #ffffff;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: #faf7f7;
        }

        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .order-id-title { font-size: 16px; font-weight: 800; color: #111; letter-spacing: -0.01em; }
        .order-date-sub { font-size: 13px; color: #777; font-weight: 500; }

        .header-center { font-size: 15px; font-weight: 800; color: #743133; }

        .header-right { display: flex; align-items: center; gap: 16px; }

        /* 狀態標籤樣式 (參考原本配色) */
        .badge {
            display: inline-block; padding: 6px 14px; border-radius: 20px;
            font-size: 12.5px; font-weight: 700; text-align: center;
        }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-warning { background: #fef3c7; color: #b45309; }
        .badge-danger { background: #fee2e2; color: #b91c1c; }

        .chevron-icon {
            font-size: 16px; color: #888; transition: transform 0.3s ease;
        }

        .accordion-card.active .chevron-icon {
            transform: rotate(180deg);
        }

        /* 摺疊面板展開內容 */
        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0, 1, 0, 1);
            background: #ffffff;
            border-top: 1px solid transparent;
        }

        .accordion-card.active .accordion-body {
            max-height: 1500px; /* 足夠大的數值 */
            transition: max-height 0.4s ease-in-out;
            border-top: 1px solid #eee;
        }

        .body-inner {
            padding: 24px;
        }

        /* 舊版表格重現樣式 */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .items-table th {
            text-align: left;
            padding: 10px 12px;
            color: #666;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        .items-table td {
            padding: 16px 12px;
            border-bottom: 1px solid #f4f4f4;
            color: #333;
            vertical-align: middle;
        }

        .item-name-cell { font-weight: 700; color: #222; }
        .item-link-btn {
            font-size: 12.5px; color: #743133; text-decoration: none; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
        }
        .item-link-btn:hover { text-decoration: underline; }

        /* 舊版底部總金額列 */
        .table-summary-row {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid #eee;
            text-align: right;
            font-size: 15px;
            color: #333;
        }

        .summary-total-price {
            font-size: 20px;
            font-weight: 800;
            color: #743133;
            margin-left: 6px;
        }

        /* 📄 分頁控制 */
        .pagination-container {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-top: 32px;
        }
        .page-btn {
            background: #ffffff; border: 1px solid rgba(116, 49, 51, 0.2);
            color: #743133; padding: 8px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .page-btn:hover:not(:disabled) { background: #743133; color: #fff; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #ddd; color: #999; }
        .page-info { font-size: 13.5px; font-weight: 600; color: #666; }

        .empty-box {
            text-align: center; padding: 60px 20px; background: #fff; border-radius: 20px;
            border: 1px dashed #ddd; color: #888;
        }
        .empty-box i { font-size: 48px; color: #ccc; margin-bottom: 12px; }

        /* 📱 手機版 Bottom Navigation Bar */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            height: 65px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.08); z-index: 1000;
            justify-content: space-around; align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #888; text-decoration: none; font-size: 11px; font-weight: 600; gap: 4px;
            width: 20%; background: none; border: none; cursor: pointer; transition: 0.2s;
        }
        .nav-item i { font-size: 18px; }
        .nav-item.active, .nav-item:hover { color: #743133; }

        /* Pop-up List 選單 */
        .popup-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1001; opacity: 0; transition: opacity 0.25s ease;
        }
        .popup-overlay.show { display: block; opacity: 1; }
        .popup-menu {
            position: fixed; bottom: -250px; left: 16px; right: 16px;
            background: #ffffff; border-radius: 20px; padding: 20px 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1002; transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .popup-overlay.show .popup-menu { bottom: 80px; }
        .popup-header { font-size: 14px; font-weight: 700; color: #743133; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        .popup-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .popup-list a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #faf7f7; border-radius: 12px; color: #333; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .popup-list a i { color: #743133; font-size: 16px; width: 20px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; width: 100%; padding-bottom: 80px; }
            .topbar { padding: 14px 20px; }
            .topbar-logo { height: 32px; }
            .mobile-lang-tag { display: block; }
            .content-area { padding: 20px; }
            .accordion-header { padding: 16px; flex-wrap: wrap; gap: 10px; }
            .header-center { order: 3; width: 100%; margin-top: 4px; }
            .items-table { display: block; overflow-x: auto; }
            .mobile-bottom-nav { display: flex; }
        }
    </style>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyTpnxEfQ9B2ysDjq-H7C1N_1BqRcEZVL0nPBInlHoYKOFQVTP-QM13pLEq3d3opbdm/exec";

        let groupedOrdersList = [];
        let currentPage = 1;
        const ORDERS_PER_PAGE = 5;

        window.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('serene_user'));

            if (!userData || !userData.phone) {
                alert("你尚未登入，請先登入帳戶！");
                window.location.href = "login.html";
                return;
            }

            const savedLang = localStorage.getItem('serene_lang') || 'zh';
            switchLanguage(savedLang);

            fetchOrders(userData.phone);
        });

        async function fetchOrders(phone) {
            const container = document.getElementById('ordersContainer');
            const currentLang = localStorage.getItem('serene_lang') || 'zh';

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getOrders", phone: phone })
                });

                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    groupedOrdersList = groupOrdersByOrderID(result.data);
                    currentPage = 1;
                    renderOrdersPage();
                } else {
                    container.innerHTML = `
                        <div class="empty-box">
                            <i class="fa-solid fa-box-open"></i>
                            <p>${currentLang === 'en' ? 'No proxy orders found' : '尚無代購訂單紀錄'}</p>
                        </div>
                    `;
                    document.getElementById('paginationControls').style.display = "none";
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fa-solid fa-triangle-exclamation" style="color:#e11d48;"></i>
                        <p>${currentLang === 'en' ? 'Failed to load order data' : '無法讀取訂單資料，請稍後再試'}</p>
                    </div>
                `;
                document.getElementById('paginationControls').style.display = "none";
            }
        }

        // 依據 OrderID 整合資料
        function groupOrdersByOrderID(rawOrders) {
            const groups = {};
            
            rawOrders.forEach(item => {
                const id = item.orderID;
                if (!groups[id]) {
                    groups[id] = {
                        orderID: id,
                        orderDate: item.orderDate,
                        paymentStatus: item.paymentStatus,
                        processStatus: item.processStatus,
                        exchangeRate: item.exchangeRate || 165,
                        items: [],
                        totalHkd: 0
                    };
                }
                groups[id].items.push(item);
                groups[id].totalHkd += parseFloat(item.totalHKD || 0);
            });

            return Object.values(groups).reverse();
        }

        // 渲染手風琴卡片
        function renderOrdersPage() {
            const container = document.getElementById('ordersContainer');
            const currentLang = localStorage.getItem('serene_lang') || 'zh';

            const totalPages = Math.ceil(groupedOrdersList.length / ORDERS_PER_PAGE) || 1;
            const startIndex = (currentPage - 1) * ORDERS_PER_PAGE;
            const endIndex = startIndex + ORDERS_PER_PAGE;
            const currentOrders = groupedOrdersList.slice(startIndex, endIndex);

            container.innerHTML = "";

            currentOrders.forEach((order, index) => {
                // 自動決定 Status 標籤樣式 (參考舊版)
                let badgeClass = "badge-warning";
                if (order.processStatus.includes("確認") || order.paymentStatus === "已付款") badgeClass = "badge-success";
                if (order.processStatus.includes("待付") || order.paymentStatus === "未付款") badgeClass = "badge-warning";

                // 舊版表格列生成的邏輯
                let tableRowsHtml = "";
                order.items.forEach(item => {
                    const linkBtnHtml = item.itemUrl ? 
                        `<br><a href="${item.itemUrl}" target="_blank" class="item-link-btn"><i class="fa-solid fa-link"></i> ${currentLang === 'en' ? 'Link' : '前往商品連結'}</a>` : '';

                    tableRowsHtml += `
                        <tr>
                            <td class="item-name-cell">${item.itemName}${linkBtnHtml}</td>
                            <td>${item.quantity}</td>
                            <td>₩ ${Number(item.krwPrice).toLocaleString()}</td>
                            <td>₩ ${Number(item.proxyFee || 5000).toLocaleString()}</td>
                            <td>₩ ${Number(item.localShippingKRW || 0).toLocaleString()}</td>
                        </tr>
                    `;
                });

                const accordionHtml = `
                    <div class="accordion-card" id="card-${index}">
                        <!-- Header 預覽列 (未展開前) -->
                        <div class="accordion-header" onclick="toggleAccordion(${index})">
                            <div class="header-left">
                                <div class="order-id-title">${currentLang === 'en' ? 'Order' : '單號'} #${order.orderID}</div>
                                <div class="order-date-sub">${currentLang === 'en' ? 'Date:' : '購買日期:'} ${order.orderDate}</div>
                            </div>

                            <div class="header-center">
                                ${currentLang === 'en' ? 'Total:' : '總金額:'} HK$ ${order.totalHkd.toFixed(2)}
                            </div>

                            <div class="header-right">
                                <span class="badge ${badgeClass}">${order.processStatus || order.paymentStatus}</span>
                                <i class="fa-solid fa-chevron-down chevron-icon"></i>
                            </div>
                        </div>

                        <!-- Body 展開細節 (舊版經典設計) -->
                        <div class="accordion-body">
                            <div class="body-inner">
                                <table class="items-table">
                                    <thead>
                                        <tr>
                                            <th>${currentLang === 'en' ? 'Item Name' : '貨品名稱'}</th>
                                            <th>${currentLang === 'en' ? 'Qty' : '數量'}</th>
                                            <th>${currentLang === 'en' ? 'KRW Price' : '韓國價錢'}</th>
                                            <th>${currentLang === 'en' ? 'Proxy Fee' : '代購費'}</th>
                                            <th>${currentLang === 'en' ? 'KR Shipping' : '韓國國內運費'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${tableRowsHtml}
                                    </tbody>
                                </table>

                                <div class="table-summary-row">
                                    <span>${currentLang === 'en' ? `Total Amount (Rate ${order.exchangeRate}):` : `訂單總數 (匯率 ${order.exchangeRate}計算):`}</span>
                                    <span class="summary-total-price">HK$ ${order.totalHkd.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += accordionHtml;
            });

            // 更新分頁 Controls
            const controls = document.getElementById('paginationControls');
            if (groupedOrdersList.length > ORDERS_PER_PAGE) {
                controls.style.display = "flex";
                document.getElementById('pageInfoText').innerText = currentLang === 'en' ? 
                    `Page ${currentPage} of ${totalPages}` : `第 ${currentPage} / ${totalPages} 頁`;
                
                document.getElementById('prevPageBtn').disabled = (currentPage === 1);
                document.getElementById('nextPageBtn').disabled = (currentPage === totalPages);
            } else {
                controls.style.display = "none";
            }
        }

        // 開啟 / 收起手風琴
        function toggleAccordion(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.toggle('active');
        }

        function changePage(direction) {
            const totalPages = Math.ceil(groupedOrdersList.length / ORDERS_PER_PAGE);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            renderOrdersPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* 雙語切換邏輯 */
        function switchLanguage(lang) {
            localStorage.setItem('serene_lang', lang);
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-HK';

            document.getElementById('btnZhDt').classList.toggle('active', lang === 'zh');
            document.getElementById('btnEnDt').classList.toggle('active', lang === 'en');
            document.getElementById('mobileLangBtn').innerText = lang === 'en' ? '繁中' : 'EN';

            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-zh');
            });

            if (groupedOrdersList.length > 0) {
                renderOrdersPage();
            }
        }

        function toggleMobileLang() {
            const currentLang = localStorage.getItem('serene_lang') || 'zh';
            switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
        }

        function toggleOrderPopup() { document.getElementById('popupOverlay').classList.toggle('show'); }
        function closeOrderPopup() { document.getElementById('popupOverlay').classList.remove('show'); }

        function logout() {
            if (window.sereneLogoutRemote) sereneLogoutRemote();
            localStorage.removeItem('serene_user');
            window.location.href = 'login.html';
        }
    </script>
<script src="ss-icons-v1.js" defer></script>
</body>
</html>
