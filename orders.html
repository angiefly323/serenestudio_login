<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 代購訂單紀錄</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        .sidebar { width: 250px; background-color: #ffffff; border-right: 1px solid #e5e7eb; position: fixed; height: 100%; z-index: 1000; transition: 0.3s; }
        .logo-area { background: #743133; padding: 20px; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 120px; }
        .logo-area img { width: 90%; max-width: 180px; height: auto; }

        .menu-list { list-style: none; padding: 10px 0; }
        .menu-list li a { display: flex; align-items: center; padding: 15px 24px; color: #4b5563; text-decoration: none; font-size: 15px; transition: 0.2s; }
        .menu-list li a i { width: 24px; font-size: 18px; margin-right: 10px; color: #9ca3af; }
        .menu-list li a:hover, .menu-list li.active a { background-color: #fdf8f8; color: #743133; border-right: 4px solid #743133; font-weight: 600; }
        .menu-list li.active a i { color: #743133; }

        .main-content { flex: 1; margin-left: 250px; transition: 0.3s; width: calc(100% - 250px); }
        .topbar { background: #fff; padding: 15px 24px; display: flex; align-items: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 99; }
        .page-title { font-size: 18px; font-weight: 600; margin-left: 15px;}
        .content-area { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .order-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; overflow: hidden; border: 1px solid #eee; }
        .order-summary { padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .order-summary:hover { background: #fafafa; }
        
        .order-info { display: flex; flex: 1; justify-content: space-between; align-items: center; padding-right: 20px; }
        .order-id { font-size: 16px; font-weight: 700; color: #111; }
        .order-date { font-size: 13px; color: #666; margin-top: 4px; }
        .order-total { font-size: 16px; font-weight: 600; color: #743133; }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.confirmed { background: #d4edda; color: #155724; }
        
        .toggle-icon { font-size: 18px; color: #aaa; transition: transform 0.3s; }
        .order-card.open .toggle-icon { transform: rotate(180deg); }

        .order-details { display: none; padding: 24px; border-top: 1px solid #eee; background: #fcfcfc; }
        .order-card.open .order-details { display: block; }
        
        .details-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .details-table th { text-align: left; padding: 10px; font-size: 13px; color: #666; border-bottom: 2px solid #ddd; }
        .details-table td { padding: 12px 10px; font-size: 14px; color: #333; border-bottom: 1px solid #eee; vertical-align: middle; }

        .fee-row { background: #fffdf9; font-weight: 600; color: #743133; }

        .order-footer { text-align: right; padding-top: 16px; font-size: 15px; font-weight: 600; border-top: 2px solid #ddd; color: #333; }
        .order-footer span { color: #743133; font-size: 20px; font-weight: 700; margin-left: 8px; }

        .no-data { text-align: center; padding: 40px; color: #888; font-size: 15px; background: #fff; border-radius: 12px; border: 1px solid #eee; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-250px); }
            .main-content { margin-left: 0; width: 100%; }
            .order-info { flex-direction: column; align-items: flex-start; gap: 8px; }
            .order-summary { flex-wrap: wrap; }
            
            .details-table th { display: none; }
            .details-table td { display: block; text-align: right; padding: 8px 10px; border-bottom: none; }
            .details-table td::before { content: attr(data-label); float: left; font-weight: 600; color: #666; }
            .details-table tr { display: block; border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="logo-area"><img src="Serenestudio_2.png" alt="Serene Studio Logo"></div>
        <ul class="menu-list">
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> 我的帳戶首頁</a></li>
            <li><a href="profile.html"><i class="fa-solid fa-id-card"></i> 會員帳戶資料</a></li>
            <li><a href="guidelines.html"><i class="fa-solid fa-book-open"></i> 購物流程及須知</a></li>
            <li class="active"><a href="orders.html"><i class="fa-solid fa-file-invoice-dollar"></i> 代購訂單紀錄</a></li>
            <li><a href="tracking.html"><i class="fa-solid fa-box-open"></i> 韓國倉及物流追蹤</a></li>
            <li><a href="consolidation.html"><i class="fa-solid fa-plane-departure"></i> 集運單及國際運費</a></li>
            <li><a href="calculator.html"><i class="fa-solid fa-calculator"></i> 運費計算機</a></li>
            <li><a href="intel.html"><i class="fa-solid fa-fire"></i> 韓國網購情報</a></li>
            <li style="margin-top: 20px; border-top: 1px solid #eee;"><a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> 登出帳戶</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="topbar">
            <button class="toggle-btn" onclick="toggleSidebar()" style="background: none; border: none; font-size: 20px; cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            <div class="page-title">代購訂單紀錄</div>
        </header>

        <div class="content-area" id="ordersContainer">
            <div class="no-data">正在載入您的訂單紀錄...</div>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyTpnxEfQ9B2ysDjq-H7C1N_1BqRcEZVL0nPBInlHoYKOFQVTP-QM13pLEq3d3opbdm/exec";

        window.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('serene_user'));
            
            if (!userData || !userData.phone) {
                alert("尚未登入或登入已過期，請重新登入！");
                window.location.href = "index.html";
                return;
            }

            fetchOrders(userData.phone);
        });

        // 階梯收費計算邏輯
        function getFeePerItem(totalQty) {
            if (totalQty >= 20) return 3500;
            if (totalQty >= 10) return 4000;
            if (totalQty >= 5)  return 4500;
            return 5000;
        }

        async function fetchOrders(phone) {
            const container = document.getElementById('ordersContainer');

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getOrders", phone: phone })
                });

                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    const groupedOrders = {};

                    result.data.forEach(item => {
                        const orderID = item.orderID;
                        const price = parseFloat(item.totalHKD) || 0;
                        const rate = item.exchangeRate || '165';

                        if (!groupedOrders[orderID]) {
                            groupedOrders[orderID] = {
                                orderID: orderID,
                                totalHKD: 0,
                                exchangeRate: rate,
                                totalQty: 0,
                                paymentStatus: item.paymentStatus || '待付款',
                                date: item.orderDate || '最近',
                                items: []
                            };
                        }

                        groupedOrders[orderID].totalHKD += price;
                        const qty = parseInt(item.quantity) || 1;
                        groupedOrders[orderID].totalQty += qty;

                        groupedOrders[orderID].items.push({
                            itemName: item.itemName,
                            quantity: qty,
                            krwPrice: item.krwPrice || '0',
                            processStatus: item.processStatus || '待確認'
                        });
                    });

                    let html = "";
                    Object.values(groupedOrders).forEach(order => {
                        const badgeClass = order.paymentStatus === '已付款' ? 'confirmed' : 'pending';
                        
                        let itemsTableRows = "";
                        order.items.forEach(subItem => {
                            itemsTableRows += `
                                <tr>
                                    <td data-label="貨品名稱">${subItem.itemName}</td>
                                    <td data-label="數量">${subItem.quantity}</td>
                                    <td data-label="韓圜價錢">₩ ${Number(subItem.krwPrice).toLocaleString()}</td>
                                    <td data-label="狀態" style="color:#743133; font-weight:600;">${subItem.processStatus}</td>
                                </tr>
                            `;
                        });

                        // 階梯計算單價與總服務費
                        const feePerItem = getFeePerItem(order.totalQty);
                        const totalFeeKrw = order.totalQty * feePerItem;

                        itemsTableRows += `
                            <tr class="fee-row">
                                <td data-label="貨品名稱">代購服務費 (₩ ${feePerItem.toLocaleString()} / 件)</td>
                                <td data-label="數量">${order.totalQty}</td>
                                <td data-label="韓圜價錢">₩ ${totalFeeKrw.toLocaleString()}</td>
                                <td data-label="狀態">已包含</td>
                            </tr>
                        `;

                        html += `
                            <div class="order-card" onclick="toggleOrder(this)">
                                <div class="order-summary">
                                    <div class="order-info">
                                        <div>
                                            <div class="order-id">單號 ${order.orderID}</div>
                                            <div class="order-date">購買日期: ${order.date}</div>
                                        </div>
                                        <div class="order-total">總金額: HK$ ${order.totalHKD.toFixed(2)}</div>
                                        <div><span class="badge ${badgeClass}">${order.paymentStatus}</span></div>
                                    </div>
                                    <i class="fa-solid fa-chevron-down toggle-icon"></i>
                                </div>
                                
                                <div class="order-details" onclick="event.stopPropagation();">
                                    <table class="details-table">
                                        <thead>
                                            <tr>
                                                <th>貨品名稱</th>
                                                <th>數量</th>
                                                <th>韓圜價錢</th>
                                                <th>狀態</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${itemsTableRows}
                                        </tbody>
                                    </table>
                                    <div class="order-footer">
                                        訂單總數 (匯率 ${order.exchangeRate} 計算): <span>HK$ ${order.totalHKD.toFixed(2)}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="no-data">目前尚無任何代購訂單紀錄。</div>`;
                }

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = `<div class="no-data" style="color: #743133;">載入訂單失敗，請稍後再試。</div>`;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.transform = sidebar.style.transform === 'translateX(0px)' ? 'translateX(-250px)' : 'translateX(0px)';
        }

        function toggleOrder(card) {
            card.classList.toggle('open');
        }
    </script>
</body>
</html>
