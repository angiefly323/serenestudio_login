<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 購物流程及買家須知</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* 側邊欄 (Sidebar) */
        .sidebar { width: 250px; background-color: #ffffff; border-right: 1px solid #e5e7eb; position: fixed; height: 100%; z-index: 1000; transition: 0.3s; }
        .logo-area { background: #743133; padding: 20px; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 120px; }
        .logo-area img { width: 90%; max-width: 180px; height: auto; }
        .menu-list { list-style: none; padding: 10px 0; }
        .menu-list li a { display: flex; align-items: center; padding: 15px 24px; color: #4b5563; text-decoration: none; font-size: 15px; transition: 0.2s; }
        .menu-list li a i { width: 24px; font-size: 18px; margin-right: 10px; color: #9ca3af; }
        .menu-list li a:hover, .menu-list li.active a { background-color: #fdf8f8; color: #743133; border-right: 4px solid #743133; font-weight: 600; }
        .menu-list li.active a i { color: #743133; }

        /* 主內容區 */
        .main-content { flex: 1; margin-left: 250px; transition: 0.3s; width: calc(100% - 250px); padding-bottom: 50px;}
        .topbar { background: #fff; padding: 15px 24px; display: flex; align-items: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 99; }
        .page-title { font-size: 18px; font-weight: 600; margin-left: 15px;}
        .content-area { padding: 24px; max-width: 1000px; margin: 0 auto; }

        /* 卡片設計 */
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #eee; margin-bottom: 30px; overflow: hidden; }
        .card-header { background: #fdf8f8; color: #743133; padding: 16px 24px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #f0d5d6; display: flex; align-items: center; gap: 10px; }
        .card-body { padding: 24px; }

        /* =========================================
           新版：圖表箭嘴流程 (Flowchart) 
        ========================================= */
        .flowchart { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .flow-step { background: #fff; border: 2px solid #f0d5d6; border-radius: 12px; padding: 20px 16px; width: 100%; text-align: center; position: relative; transition: 0.2s; flex: 1; display: flex; flex-direction: column; }
        .flow-step:hover { border-color: #743133; box-shadow: 0 4px 15px rgba(116,49,51,0.08); transform: translateY(-3px); }
        
        .step-num { position: absolute; top: -12px; left: 16px; background: #743133; color: #fff; font-size: 12px; font-weight: bold; padding: 2px 10px; border-radius: 20px; }
        
        .flow-icon { font-size: 28px; color: #743133; margin-bottom: 12px; margin-top: 5px; }
        .flow-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 10px; line-height: 1.4; }
        .flow-desc { font-size: 13px; color: #555; line-height: 1.5; text-align: justify; flex-grow: 1; }
        
        .flow-highlight { background: #fffbeb; color: #b45309; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 12px; text-align: left; }

        /* 箭嘴設計 */
        .flow-arrow { color: #ccc; font-size: 24px; display: flex; justify-content: center; align-items: center; padding: 5px 0; }
        .desktop-arrow { display: none; }
        .mobile-arrow { display: block; }

        /* 收費結構表格 */
        .fee-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .fee-table th { text-align: left; padding: 12px 16px; background: #fafafa; border-bottom: 2px solid #eee; font-size: 14px; color: #333; }
        .fee-table td { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #555; vertical-align: top; }
        .fee-table tr:last-child td { border-bottom: none; }
        .price-tag { color: #743133; font-weight: bold; font-size: 16px; }
        
        /* 讓表格第一欄（收費項目）文字保持一行不換行 */
        .fee-table th:first-child, .fee-table td:first-child {
            white-space: nowrap; 
            width: 1%; 
            padding-right: 24px; 
        }
        /* 摺疊式條款 (Accordion) */
        .accordion { border: 1px solid #eee; border-radius: 8px; margin-bottom: 12px; overflow: hidden; transition: 0.2s; }
        .accordion-header { padding: 16px 20px; background: #fafafa; font-weight: 600; color: #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .accordion-header:hover { background: #f4f6f9; }
        .accordion-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease; font-size: 14px; color: #555; line-height: 1.6; background: #fff; }
        .accordion.open { border-color: #743133; box-shadow: 0 2px 8px rgba(116,49,51,0.1); }
        .accordion.open .accordion-header { background: #743133; color: #fff; }
        .accordion.open .accordion-body { padding: 16px 20px; max-height: 500px; border-top: 1px solid #eee; }
        .accordion-icon { transition: transform 0.3s; }
        .accordion.open .accordion-icon { transform: rotate(180deg); }

        /* 平板及電腦版適應 (讓流程圖變橫向) */
        @media (min-width: 900px) {
            .flowchart { flex-direction: row; align-items: stretch; gap: 10px; }
            .flow-step { padding: 25px 16px; }
            .flow-arrow { padding: 0 5px; color: #eab8b9; }
            .desktop-arrow { display: block; }
            .mobile-arrow { display: none; }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-250px); }
            .main-content { margin-left: 0; width: 100%; }
        }
    </style>
</head>
