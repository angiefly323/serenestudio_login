<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 客戶專區登入</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* 網頁背景改為 #743133 */
        body { 
            background-color: #743133; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .login-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.2); 
            padding: 32px 24px; 
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        
        /* Logo 樣式調整 */
        .header img { 
            width: 100%; 
            max-width: 180px; 
            height: auto; 
            border-radius: 8px; 
            margin-bottom: 12px; 
        }
        
        .header h1 { font-size: 20px; color: #111; margin-bottom: 6px; font-weight: 700; }
        .header p { font-size: 13px; color: #666; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        
        /* 電話輸入框與下拉選單組合 */
        .phone-input { display: flex; align-items: center; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        
        .prefix-select { 
            background: #f5f5f5; 
            padding: 12px 10px; 
            font-size: 14px; 
            color: #333; 
            border: none; 
            border-right: 1px solid #ddd; 
            outline: none; 
            cursor: pointer;
            font-weight: 600;
        }
        
        .phone-input input { border: none; padding: 12px; width: 100%; font-size: 14px; outline: none; }
        
        .input-field { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .input-field:focus, .phone-input:focus-within { border-color: #743133; }

        .forgot-pw { text-align: right; margin-bottom: 20px; }
        .forgot-pw a { color: #666; font-size: 12px; text-decoration: none; }
        .forgot-pw a:hover { text-decoration: underline; }

        .btn-login { 
            width: 100%; 
            background: #743133; 
            color: #fff; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .btn-login:hover { background: #5a2527; }

        .new-user-box { 
            margin-top: 28px; 
            background: #fdf8f8; 
            border: 1px solid #f0d5d6; 
            border-radius: 10px; 
            padding: 18px; 
            text-align: center; 
        }
        .new-user-box h2 { font-size: 14px; color: #743133; margin-bottom: 8px; font-weight: 700; }
        .new-user-box p { font-size: 12px; color: #555; line-height: 1.6; margin-bottom: 14px; text-align: left; }
        
        .btn-whatsapp { 
            display: inline-flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            background: #25D366; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: 600; 
            border-radius: 8px; 
            transition: 0.2s; 
        }
        .btn-whatsapp:hover { background: #1ebe56; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 頂部 Logo 與標題區 -->
        <div class="header">
            <img src="Serenestudio.png" alt="Serene Studio Logo">
            <h1>歡迎登入客戶專區</h1>
            <p>隨時追蹤你的韓國代購訂單與物流狀態</p>
        </div>

        <!-- 登入表單區 -->
        <form onsubmit="event.preventDefault(); alert('這是版面示範，尚未連結後台資料庫！');">
            <div class="form-group">
                <label>登入電話號碼</label>
                <div class="phone-input">
                    <!-- 電話區碼下拉選單 (+852 / +886) -->
                    <select class="prefix-select">
                        <option value="+852">+852</option>
                        <option value="+886">+886</option>
                    </select>
                    <input type="tel" placeholder="請輸入電話號碼" required>
                </div>
            </div>

            <div class="form-group">
                <label>密碼</label>
                <input type="password" class="input-field" placeholder="請輸入系統預設或專屬密碼" required>
            </div>

            <div class="forgot-pw">
                <a href="#">忘記密碼？</a>
            </div>

            <button type="submit" class="btn-login">登入</button>
        </form>

        <!-- 新手引導提示區 -->
        <div class="new-user-box">
            <h2>首次使用代購服務？</h2>
            <p>為確保代購報價準確，首次落單請直接 WhatsApp 聯絡我們。提供商品連結後，我們會為你計算專屬報價（劃一 5,000 KRW 手續費）。<br><br>確認 FPS / PayMe 付款後，客服會即時發送你的專屬<strong>登入電話號碼</strong>及<strong>系統預設密碼</strong>！</p>
            <a href="https://wa.me/85200000000" class="btn-whatsapp" target="_blank">馬上 WhatsApp 客服落單</a>
        </div>
    </div>

</body>
</html>
