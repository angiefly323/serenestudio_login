<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Studio - 申請集運及運費</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* 側邊欄 (Sidebar) */
        .sidebar { width: 250px; background-color: #ffffff; border-right: 1px solid #e5e7eb; position: fixed; height: 100%; z-index: 1000; transition: 0.3s; }
        .logo-area { background: #743133; padding: 20px; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 120px; }
        .logo-area img { width: 90%; max-width: 180px; height: auto; }

        .menu-list { list-style: none; padding: 10px 0; }
        .menu-list li a { display: flex; align-items: center; padding: 15px 24px; color: #4b5563; text-decoration: none; font-size: 15px; transition: 0.2s; }
        .menu-list li a i { width: 24px; font-size: 18px; margin-right: 10px; color: #9ca3af; }
        .menu-list li a:hover, .menu-list li.active a { background-color: #fdf8f8; color: #743133; border-right: 4px solid #743133; font-weight: 600; }
        .menu-list li.active a i { color: #743133; }

        /* 主內容區 */
        .main-content { flex: 1; margin-left: 250px; transition: 0.3s; width: calc(100% - 250px); padding-bottom: 50px; }
        .topbar { background: #fff; padding: 15px 24px; display: flex; align-items: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 99; }
        .page-title { font-size: 18px; font-weight: 600; margin-left: 15px;}
        .content-area { padding: 24px; max-width: 1000px; margin: 0 auto; }

        /* 卡片設計 */
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #eee; margin-bottom: 30px; overflow: hidden; }
        .card-header { background: #fdf8f8; color: #743133; padding: 16px 24px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #f0d5d6; display: flex; align-items: center; gap: 10px; }
        .card-body { padding: 24px; }

        /* 表單元素 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #743133; }
        textarea.form-control { resize: vertical; min-height: 100px; }

        .btn-submit { background: #743133; color: #fff; border: none; padding: 14px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn-submit:hover { background: #5a2527; }

        /* 歷史申請表格 */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .history-table th { text-align: left; padding: 12px 16px; background: #fafafa; border-bottom: 2px solid #eee; font-size: 14px; color: #333; }
        .history-table td { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #555; vertical-align: middle; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #fff3cd; color: #856404; }
        .badge.ready { background: #d4edda; color: #155724; }

        .no-data { text-align: center; padding: 30px; color: #888; font-size: 14px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-250px); }
            .main-content { margin-left: 0; width: 100%; }
            .history-table th { display: none; }
            .history-table td { display: block; text-align: right; padding: 8px 12px; border-bottom: none; }
            .history-table td::before { content: attr(data-label); float: left; font-weight: 600; color: #666; }
            .history-table tr { display: block; border-bottom: 1px solid #ddd; margin-bottom: 12px; padding-bottom: 8px; }
        }
    </style>
</head>
<body>

    <!-- 左邊側邊欄 -->
    <nav class="sidebar" id="sidebar">
        <div class="logo-area">
            <img src="Serenestudio_2.png" alt="Serene Studio Logo">
        </div>
        <ul class="menu-list">
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> 我的帳戶首頁</a></li>
            <li><a href="profile.html"><i class="fa-solid fa-id-card"></i> 會員帳戶資料</a></li>
            <li><a href="guidelines.html"><i class="fa-solid fa-book-open"></i> 購物流程及須知</a></li>
            <li><a href="orders.html"><i class="fa-solid fa-file-invoice-dollar"></i> 代購訂單紀錄</a></li>
            <li><a href="tracking.html"><i class="fa-solid fa-box-open"></i> 韓國倉及物流追蹤</a></li>
            <li class="active"><a href="consolidation.html"><i class="fa-solid fa-plane-departure"></i> 申請集運及運費</a></li>
            <li><a href="calculator.html"><i class="fa-solid fa-calculator"></i> 運費計算機</a></li>
            <li><a href="intel.html"><i class="fa-solid fa-fire"></i> 韓國網購情報</a></li>
            <li style="margin-top: 20px; border-top: 1px solid #eee;"><a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> 登出帳戶</a></li>
        </ul>
    </nav>

    <!-- 主內容區 -->
    <main class="main-content">
        <header class="topbar">
            <button class="toggle-btn" onclick="toggleSidebar()" style="background: none; border: none; font-size: 20px; cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
            <div class="page-title">申請集運及運費</div>
        </header>

        <div class="content-area">
            
            <!-- 表單卡片：提交新集運申請 -->
            <div class="card">
                <div class="card-header"><i class="fa-solid fa-boxes-packing"></i> 填寫集運申請表格</div>
                <div class="card-body">
                    <form id="consolidationForm" onsubmit="submitConsolidation(event)">
                        <div class="form-group">
                            <label>勾選或輸入想要集運回港的貨品/訂單號碼</label>
                            <textarea id="itemsInput" class="form-control" placeholder="例如：#ORD-261023-01 (NCT 手燈)、Olive Young 痘痘貼" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>選擇收貨方式</label>
                            <select id="deliveryMethod" class="form-control">
                                <option value="觀塘工作室自取 (免費)">觀塘工作室自取 (免費)</option>
                                <option value="順豐到付 (運費到付由順豐收取)">順豐到付 (運費到付由順豐收取)</option>
                            </select>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-submit">提交集運申請</button>
                    </form>
                </div>
            </div>

            <!-- 歷史申請卡片 -->
            <div class="card">
                <div class="card-header"><i class="fa-solid fa-clock-rotate-left"></i> 我的集運申請紀錄</div>
                <div class="card-body" style="padding: 0;">
                    <div id="historyContainer">
                        <div class="no-data">正在載入集運申請紀錄...</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyTpnxEfQ9B2ysDjq-H7C1N_1BqRcEZVL0nPBInlHoYKOFQVTP-QM13pLEq3d3opbdm/exec";
        let currentUserPhone = "";

        window.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('serene_user'));
            
            if (!userData || !userData.phone) {
                alert("尚未登入或登入已過期，請重新登入！");
                window.location.href = "index.html";
                return;
            }

            currentUserPhone = userData.phone;
            fetchConsolidations(currentUserPhone);
        });

        // 提交集運申請
        async function submitConsolidation(event) {
            event.preventDefault();

            const items = document.getElementById('itemsInput').value.trim();
            const deliveryMethod = document.getElementById('deliveryMethod').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.innerText = "提交中...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "submitConsolidation",
                        phone: currentUserPhone,
                        items: items,
                        deliveryMethod: deliveryMethod
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("集運申請已成功提交！店主已收到電郵通知，將會為您核對重量並更新運費。");
                    document.getElementById('consolidationForm').reset();
                    fetchConsolidations(currentUserPhone); // 重新整理歷史紀錄
                } else {
                    alert("提交失敗：" + result.message);
                }

            } catch (error) {
                console.error("Error:", error);
                alert("伺服器連接錯誤，請稍後再試！");
            } finally {
                submitBtn.innerText = "提交集運申請";
                submitBtn.disabled = false;
            }
        }

        // 讀取歷史集運申請
        async function fetchConsolidations(phone) {
            const container = document.getElementById('historyContainer');

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "getConsolidations",
                        phone: phone
                    })
                });

                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    let html = `
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>申請編號</th>
                                    <th>集運貨品</th>
                                    <th>收貨方式</th>
                                    <th>國際運費</th>
                                    <th>狀態</th>
                                    <th>申請時間</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    result.data.forEach(item => {
                        const isReady = item.status !== "待定";
                        const badgeClass = isReady ? "badge ready" : "badge";

                        html += `
                            <tr>
                                <td data-label="申請編號"><strong>${item.requestId}</strong></td>
                                <td data-label="集運貨品">${item.items}</td>
                                <td data-label="收貨方式">${item.deliveryMethod}</td>
                                <td data-label="國際運費" style="color: #743133; font-weight: 600;">${item.shippingFee}</td>
                                <td data-label="狀態"><span class="${badgeClass}">${item.status}</span></td>
                                <td data-label="申請時間" style="font-size: 12px; color: #888;">${item.timestamp}</td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="no-data">目前尚無任何集運申請紀錄。</div>`;
                }

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = `<div class="no-data" style="color: #743133;">載入集運紀錄失敗。</div>`;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.transform = sidebar.style.transform === 'translateX(0px)' ? 'translateX(-250px)' : 'translateX(0px)';
        }
    </script>
</body>
</html>
